# The task types of the B1 exam, and the answer formats of the app.
#
# This file is the one source of these IDs and of their data; the tables of
# docs/task-types.md show them. What each type is, the rules for its items and
# the checks of the validator are in the prose of that document.
#
# An ID in use is never renamed and never reused: the user tables of the app
# keep the results by ID. An entry that is no longer needed stays here with
# `retired: true`.
#
# answer_formats: the input of the app for each format.
#   id               the format, referred to by `answer` of a task type
#   user_does        what the user does
#   recorded_answer  what the user tables keep for the results
#
# task_types: in the order of the exam.
#   id         <part>.<type>
#   part       listening, reading, writing or speaking: the first part of the ID
#   greek      the Greek name
#   exam_slot  where the type is in the exam
#   items      the counts of an item of the type, as the overview shows them
#   points     the points, as the overview shows them
#   minutes    the time of the task: the time limit of a trial of an item of the type, in
#              whole or half minutes, derived from the time of its part in the exam (see
#              docs/task-types.md)
#   answer     the ID of the answer format
#   scored_by  who scores the answer, and how
#   genres     writing only: the text types that an item can ask for
#   kinds      speaking.roleplay only: the kinds of role play

answer_formats:
  - id: choice
    retired: false
    user_does: 'Picks one of a fixed set of options for each item: ΣΩΣΤΟ / ΛΑΘΟΣ, or α / β / γ.'
    recorded_answer: The option of each item.

  - id: assign
    retired: false
    user_does: >-
      Matches each item to one entry of a list that has more entries than items; an entry is used at
      most once.
    recorded_answer: The entry of each item.

  - id: grid
    retired: false
    user_does: >-
      Ticks cells of a grid; the task states the total number of ticks, and the app accepts no more.
    recorded_answer: The set of ticked cells.

  - id: short_text
    retired: false
    user_does: Writes a short answer of a few words for each item.
    recorded_answer: >-
      The text of each item, the result of the match, and whether the user overrode it.

  - id: text
    retired: false
    user_does: Writes a text, with the keyboard (story 10) or the S Pen (story 11).
    recorded_answer: The text, the word count, the input method, the time taken.

  - id: speech
    retired: false
    user_does: Speaks, after a question or a picture; one recording per prompt.
    recorded_answer: The audio and the transcript with timing, per prompt.

  - id: dialogue
    retired: false
    user_does: Speaks in turns with the app, which plays the partner.
    recorded_answer: The turns of both sides, with the audio and the transcript of the user's turns.

