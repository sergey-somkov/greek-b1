task_type: listening.notes
situation: past_present.life_stories
retired: false
title: Ο φούρνος της γειτονιάς
framing: >-
  Θα ακούσετε δύο (2) φορές μια συνέντευξη με τον ιδιοκτήτη ενός φούρνου. Κρατάτε
  πολύ σύντομες σημειώσεις (1-3 λέξεις), όπως στο παράδειγμα.
instruction: Οι σημειώσεις που πρέπει να κρατήσετε είναι ΔΩΔΕΚΑ (12) χωρίς το παράδειγμα.
speakers:
  - name: Δημοσιογράφος
    gender: female
    age: adult
  - name: Κώστας
    gender: male
    age: senior
script:
  - speaker: Δημοσιογράφος
    text: >-
      Καλημέρα σας. Σήμερα βρισκόμαστε σε έναν παλιό φούρνο της Λευκωσίας. Κύριε Κώστα,
      πότε ανοίξατε τον φούρνο σας;
  - speaker: Κώστας
    text: >-
      Τον άνοιξα το 1987, μαζί με τη γυναίκα μου. Τότε η γειτονιά ήταν ακόμα μικρή και
      είχε λίγα σπίτια.
  - speaker: Δημοσιογράφος
    text: Και πώς μάθατε να φτιάχνετε ψωμί;
  - speaker: Κώστας
    text: >-
      Από τον πατέρα μου. Είχε φούρνο στο χωριό μας, κοντά στην Πάφο. Από δώδεκα χρονών τον
      βοηθούσα κάθε καλοκαίρι.
  - speaker: Δημοσιογράφος
    text: Τι ώρα αρχίζει η μέρα σας;
  - speaker: Κώστας
    text: >-
      Ξυπνάω στις τρεις το πρωί. Στις τέσσερις ανάβω τον φούρνο, και στις έξι το πρώτο
      ψωμί είναι έτοιμο.
  - speaker: Δημοσιογράφος
    text: Και τι πουλάτε περισσότερο;
  - speaker: Κώστας
    text: >-
      Το χωριάτικο ψωμί, φυσικά, και τα κουλούρια με σουσάμι. Τα παιδιά τα παίρνουν κάθε
      πρωί για το σχολείο. Το Πάσχα φτιάχνουμε και φλαούνες, και τότε δεν προλαβαίνουμε.
  - speaker: Δημοσιογράφος
    text: Πόσοι δουλεύουν σήμερα στον φούρνο;
  - speaker: Κώστας
    text: >-
      Είμαστε έξι άτομα. Ο γιος μου φτιάχνει το ψωμί μαζί μου, και η κόρη μου είναι στο
      ταμείο. Η γυναίκα μου βγήκε στη σύνταξη πέρσι.
  - speaker: Δημοσιογράφος
    text: Έχει αλλάξει πολύ η δουλειά από τότε;
  - speaker: Κώστας
    text: >-
      Πάρα πολύ. Παλιά ζυμώναμε τα πάντα με τα χέρια. Σήμερα έχουμε μηχανήματα. Το
      προζύμι όμως είναι ακόμα το ίδιο, από τη συνταγή του πατέρα μου.
  - speaker: Δημοσιογράφος
    text: Ποια ήταν η πιο δύσκολη στιγμή;
  - speaker: Κώστας
    text: >-
      Πριν από δέκα χρόνια, όταν άνοιξε ένα μεγάλο σούπερ μάρκετ στον δρόμο μας. Για έναν
      χρόνο είχαμε λίγους πελάτες. Μετά όμως γύρισαν, γιατί ήθελαν φρέσκο ψωμί, όπως παλιά.
  - speaker: Δημοσιογράφος
    text: Τι κάνετε με το ψωμί που μένει το βράδυ;
  - speaker: Κώστας
    text: >-
      Δεν το πετάμε ποτέ. Το δίνουμε σε ένα γηροκομείο της γειτονιάς.
  - speaker: Δημοσιογράφος
    text: Και τα σχέδιά σας για το μέλλον;
  - speaker: Κώστας
    text: >-
      Σε τρία χρόνια θα πάρω σύνταξη. Τον φούρνο θα τον κρατήσει ο γιος μου. Εγώ θα
      περνάω πού και πού, για να δοκιμάζω το ψωμί του!
max_words: 3
example:
  label: Χρονολογία που άνοιξε ο φούρνος
  answers: ['1987']
  explanation: '"Τον άνοιξα το 1987".'
lines:
  - label: Άνοιξε τον φούρνο μαζί με
    answers: [(τη) γυναίκα (του), (τη) γυναίκα μου]
    explanation: '"μαζί με τη γυναίκα μου".'
  - label: Έμαθε να φτιάχνει ψωμί από
    answers: [(τον) πατέρα (του), (τον) πατέρα μου]
    explanation: '"Από τον πατέρα μου".'
  - label: Ηλικία, όταν άρχισε να βοηθά στον φούρνο
    answers: [δώδεκα (χρονών), δώδεκα (χρόνων)]
    explanation: '"Από δώδεκα χρονών τον βοηθούσα".'
  - label: Ώρα που ξυπνά
    answers: [(στις) τρεις, τρεις το πρωί]
    explanation: '"Ξυπνάω στις τρεις το πρωί".'
  - label: Τα προϊόντα που πουλά περισσότερο
    any_order:
      - [(χωριάτικο) ψωμί]
      - [κουλούρια (με σουσάμι)]
    explanation: '"Το χωριάτικο ψωμί, φυσικά, και τα κουλούρια με σουσάμι".'
  - label: Φτιάχνουν το Πάσχα
    answers: [φλαούνες]
    explanation: '"Το Πάσχα φτιάχνουμε και φλαούνες".'
  - label: Άτομα που δουλεύουν στον φούρνο
    answers: [έξι (άτομα)]
    explanation: '"Είμαστε έξι άτομα".'
  - label: Η κόρη του δουλεύει
    answers: [(στο) ταμείο]
    explanation: '"η κόρη μου είναι στο ταμείο".'
  - label: Είναι ακόμα από τη συνταγή του πατέρα του
    answers: [(το) προζύμι]
    explanation: '"Το προζύμι όμως είναι ακόμα το ίδιο".'
  - label: Δίνουν το ψωμί που μένει σε
    answers: [(ένα) γηροκομείο]
    explanation: '"Το δίνουμε σε ένα γηροκομείο της γειτονιάς".'
  - label: Θα κρατήσει τον φούρνο
    answers: [(ο) γιος (του), (ο) γιος μου]
    explanation: '"Τον φούρνο θα τον κρατήσει ο γιος μου".'
