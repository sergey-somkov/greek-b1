title: Το πρώτο μου ποδήλατο
framing: >-
  Διαβάζετε σε ένα περιοδικό την ιστορία ενός αναγνώστη. Καθώς διαβάζετε, σημειώνετε
  ΣΩΣΤΟ για τις προτάσεις που συμφωνούν με το κείμενο ή ΛΑΘΟΣ για τις προτάσεις που
  δεν συμφωνούν, όπως στο παράδειγμα.
instruction: Πρέπει να σημειώσετε συνολικά ΕΞΙ (6) απαντήσεις χωρίς το παράδειγμα.
text: >-
  Ήμουν δέκα χρονών, όταν ο πατέρας μου μού έφερε το πρώτο μου ποδήλατο. Δεν ήταν
  καινούργιο: το είχε αγοράσει από έναν γείτονα και το είχε βάψει κόκκινο. Για μένα όμως
  ήταν το πιο ωραίο ποδήλατο του κόσμου. Το καθάριζα κάθε Σάββατο με ένα πανί.

  Κάθε απόγευμα, μετά το σχολείο, έκανα βόλτες στη γειτονιά με τους φίλους μου. Η μητέρα
  μου ανησυχούσε και μου έλεγε να μην πηγαίνω στον μεγάλο δρόμο, γιατί από εκεί περνούσαν
  πολλά αυτοκίνητα. Εγώ την άκουγα, τις περισσότερες φορές.

  Ένα καλοκαίρι αποφασίσαμε με τον φίλο μου τον Μιχάλη να πάμε με τα ποδήλατα ως το χωριό
  του παππού του, που ήταν δεκαπέντε χιλιόμετρα μακριά. Ξεκινήσαμε νωρίς το πρωί, αλλά στη
  μέση του δρόμου έσπασε η αλυσίδα του ποδηλάτου μου. Περπατήσαμε δύο ώρες κάτω από τον
  ήλιο, σπρώχνοντας τα ποδήλατα. Όταν φτάσαμε επιτέλους στο χωριό, η γιαγιά του Μιχάλη μάς
  έδωσε κρύο νερό και καρπούζι. Ο παππούς του διόρθωσε την αλυσίδα και το ίδιο απόγευμα
  μας έφερε πίσω στην πόλη με το αυτοκίνητό του.

  Σήμερα έχω δικό μου αυτοκίνητο, αλλά κάθε Κυριακή πρωί κάνω ακόμα ποδήλατο δίπλα στη
  θάλασσα, στην παραλία της Λάρνακας.
example:
  statement: Ο αφηγητής πήρε το πρώτο του ποδήλατο από τον πατέρα του.
  answer: true
  explanation: '"ο πατέρας μου μού έφερε το πρώτο μου ποδήλατο": his father brought it.'
statements:
  - statement: Ο πατέρας αγόρασε το ποδήλατο από ένα κατάστημα.
    answer: false
    explanation: '"το είχε αγοράσει από έναν γείτονα": from a neighbor, not from a shop.'
  - statement: Η μητέρα δεν ήθελε να πηγαίνει ο αφηγητής στον μεγάλο δρόμο.
    answer: true
    explanation: >-
      "Η μητέρα μου ανησυχούσε και μου έλεγε να μην πηγαίνω στον μεγάλο δρόμο, γιατί από
      εκεί περνούσαν πολλά αυτοκίνητα": she worried because of the cars.
  - statement: Τα δύο παιδιά έκαναν όλο τον δρόμο ως το χωριό πάνω στα ποδήλατά τους.
    answer: false
    explanation: >-
      "στη μέση του δρόμου έσπασε η αλυσίδα ... Περπατήσαμε δύο ώρες ... σπρώχνοντας τα
      ποδήλατα": the chain broke halfway, and they walked the rest.
  - statement: Στο χωριό η γιαγιά του Μιχάλη τούς έδωσε κάτι να φάνε.
    answer: true
    explanation: '"η γιαγιά του Μιχάλη μάς έδωσε κρύο νερό και καρπούζι": watermelon is food.'
  - statement: Τα παιδιά γύρισαν στην πόλη την επόμενη μέρα.
    answer: false
    explanation: '"το ίδιο απόγευμα μας έφερε πίσω στην πόλη": the same afternoon.'
  - statement: Ο αφηγητής κάνει ποδήλατο και σήμερα.
    answer: true
    explanation: '"κάθε Κυριακή πρωί κάνω ακόμα ποδήλατο": he still rides every Sunday.'
