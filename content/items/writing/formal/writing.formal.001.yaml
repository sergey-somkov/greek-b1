task_type: writing.formal
situation: services.authorities
functions: [complain, give_reasons, request]
retired: false
title: Σκοτεινός δρόμος
framing: >-
  Τα φώτα στον δρόμο όπου μένετε, στη Λεμεσό, δεν ανάβουν εδώ και έναν μήνα. Το βράδυ ο δρόμος
  είναι πολύ σκοτεινός και οι γείτονές σας φοβούνται να περπατούν εκεί. Έχετε
  τηλεφωνήσει δύο φορές στον δήμο, αλλά κανείς δεν ήρθε. Γράφετε μια επιστολή στον
  δήμαρχο, για να πείτε τα παράπονά σας και να ζητήσετε να λυθεί το πρόβλημα.
  (150 λέξεις)
instruction: >-
  Στο τέλος της επιστολής μην υπογράψετε με το όνομά σας. Υπογράψτε ως Ελένη
  Κωνσταντίνου.
genre: formal_letter
points_to_cover:
  - Περιγράψτε το πρόβλημα και πείτε από πότε υπάρχει.
  - Εξηγήστε γιατί είναι επικίνδυνο για τους κατοίκους.
  - Ζητήστε να διορθωθεί σύντομα.
opening: |-
  Λεμεσός, 3 Νοεμβρίου
  Αξιότιμε κύριε Δήμαρχε,
  Σας γράφω για να
signature: Ελένη Κωνσταντίνου
model_answer: |-
  Λεμεσός, 3 Νοεμβρίου
  Αξιότιμε κύριε Δήμαρχε,
  Σας γράφω για να εκφράσω τα παράπονά μου για ένα πρόβλημα στον δρόμο όπου μένω, την οδό Ανεξαρτησίας. Εδώ και έναν μήνα τα φώτα του δρόμου δεν ανάβουν, και το βράδυ δεν βλέπει κανείς τίποτα.
  Η κατάσταση αυτή είναι επικίνδυνη για όλους τους κατοίκους. Στη γειτονιά μας μένουν πολλοί ηλικιωμένοι, που φοβούνται να βγουν από το σπίτι τους μετά τις έξι. Τα παιδιά γυρίζουν από τα φροντιστήρια με τα πόδια, στο σκοτάδι. Επίσης, τα αυτοκίνητα δεν βλέπουν καλά τους πεζούς, και πριν από μια εβδομάδα ένα αυτοκίνητο παραλίγο να χτυπήσει μια γυναίκα.
  Έχω τηλεφωνήσει δύο φορές στον δήμο, αλλά δυστυχώς κανείς δεν ήρθε να δει το πρόβλημα.
  Γι’ αυτό σας παρακαλώ να στείλετε έναν τεχνικό το συντομότερο δυνατόν, για να διορθώσει τα φώτα. Ελπίζω να λυθεί το πρόβλημα πριν από τον χειμώνα, όταν οι νύχτες είναι μεγάλες.
  Σας ευχαριστώ εκ των προτέρων.
  Με εκτίμηση,
  Ελένη Κωνσταντίνου
